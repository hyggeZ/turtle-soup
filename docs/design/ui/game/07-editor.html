<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海龟汤 · 发布题目静态图</title><link rel="stylesheet" href="theme.css"></head>
<body class="inner-screen"><main class="inner-width">
  <div class="inner-top"><a href="01-home.html" class="back-button" style="text-decoration:none"><span>←</span> 返回首页</a><span class="turtle-mark" aria-hidden="true"></span></div><h1 class="inner-title serif">发布题目</h1>
  <form><div class="editor-grid"><div class="editor-paper paper-panel"><i class="corner-tape"></i><label class="field">标题<input type="text" maxlength="80" placeholder="给这道汤取一个名字"></label><label class="field">汤面<textarea rows="5" maxlength="2000" placeholder="玩家首先看到的故事；留下线索，也保留谜题。"></textarea></label><label class="field">汤底<textarea rows="6" maxlength="5000" placeholder="写下完整真相。玩家需要主动查看，普通浏览不会显示。"></textarea></label></div>
    <aside class="settings-paper paper-panel"><h2 class="serif">题目设置</h2><div class="setting"><p>类型</p><div class="segmented"><button type="button" class="selected">本格</button><button type="button">变格</button></div></div><div class="setting"><p>难度</p><div class="segmented"><button type="button">1</button><button type="button">2</button><button type="button" class="selected">3</button><button type="button">4</button><button type="button">5</button></div></div><div class="setting"><p>恐怖程度</p><div class="segmented terror"><button type="button" class="selected">0</button><button type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><button type="button">5</button></div></div><div class="hairline"></div><p style="font-size:12px;line-height:1.7;color:#795d56">标题、汤面与汤底均为必填。</p></aside></div>
    <div class="editor-submit"><small>发布后可在个人主页查看和编辑。</small><button type="button" class="stamp-button">发布题目 <span class="arrow">↗</span></button></div>
  </form>
</main></body></html>
